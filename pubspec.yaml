name: centinela
description: "App de seguridad personal Centinela"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===== Firebase =====
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ===== Base de datos local =====
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ===== Permisos =====
  permission_handler: ^11.3.1

  # ===== GPS =====
  geolocator: ^13.0.1

  # ===== Abrir WhatsApp, marcador, etc. =====
  url_launcher: ^6.3.0

  # ===== Compartir archivos (audio, etc.) =====
  share_plus: 10.0.1

  # ===== Grabar audio =====
  record: ^7.1.1

  # ===== Sensores (agitado) =====
  sensors_plus: ^6.0.1

  # ===== Servicio en segundo plano =====
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7

  # ===== Preferencias (PINs) =====
  shared_preferences: ^2.3.2

  # ===== Rutas de archivos =====
  path_provider: ^2.1.4
  # SMS y apertura de la alarma desde el servicio (reemplaza a telephony,
  # que se colgaba sin Activity).
  centinela_nativo:
    path: packages/centinela_nativo
  flutter_local_notifications: ^22.3.1
  audioplayers: ^6.8.1
  http: ^1.6.0
  pdf: ^3.13.1
  printing: ^5.15.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# ===== RESOLUCIÓN DE CONFLICTO =====
# Fuerza la versión 1.x del paquete 'web' para todos los paquetes.
# Es seguro porque la app es para Android, no para web.
dependency_overrides:
  web: ^1.0.0